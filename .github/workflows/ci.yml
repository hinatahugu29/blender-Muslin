# Blender を必要としない検証を自動で回す。
#
# この repo の検証は3層ある:
#   1. cargo test            — 物理コア(pyo3 非依存)          → CI で回せる
#   2. verify_core.py        — ビルドした拡張モジュール + bpy 非依存部分 → CI で回せる
#   3. blender_selftest.py   — アドオン層(bpy 必須)           → CI では回せない
#
# 3 は Blender の実行が要るのでローカル専用。README の手順を参照。
#
# clippy はゲートにしていない。`-D warnings` にすると Vec3::sub / add の命名や
# 引数の個数など、意図してそうしている箇所に当たるため。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests:
    # 物理コアはプラットフォーム依存の処理を持たないが、「持っていないこと」は
    # 実際に走らせないと分からない。配布は今のところ Windows のみだが、
    # Linux と macOS でも通ることを確かめておく(クロスプラットフォーム対応の下地)
    name: 物理コアの単体テスト (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/cloth_core
          key: ${{ matrix.os }}

      # --no-default-features で pyo3 を外せるので Python 抜きで検証できる。
      # 物理コアを pyo3 非依存に保っている理由がここで効く。
      - name: cargo test
        run: cargo test --no-default-features --release --manifest-path rust/cloth_core/Cargo.toml

  verify-core:
    # 拡張モジュール(wheel)まで作って、Blender の外の Python から叩く。
    # 3 OS で wheel が作れることの確認も兼ねる
    name: コア検証ハーネス (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/cloth_core
          key: ${{ matrix.os }}-wheel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # numpy は transform.py が使う。無いと座標変換の項目が SKIP になる
      - name: 依存を入れる
        run: python -m pip install --upgrade pip maturin numpy

      # 配布は abi3-py311 の wheel なので、CI でも同じ作り方で通す。
      # shell を bash に固定する。Windows の既定は pwsh で、複数行のうち
      # 先頭のコマンドが失敗しても step が落ちないことがある
      - name: 拡張モジュールをビルドして入れる
        shell: bash
        run: |
          set -euo pipefail
          maturin build --release --manifest-path rust/cloth_core/Cargo.toml --out dist-ci
          python -m pip install --no-index --find-links dist-ci cloth_core

      - name: verify_core.py
        shell: bash
        run: python scripts/verify_core.py
