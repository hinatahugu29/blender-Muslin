[package]
name = "cloth_core"
version = "0.3.0"
edition = "2021"

[lib]
name = "cloth_core"
# rlib も出すことで `cargo test --no-default-features` から物理コアを検証できる
crate-type = ["cdylib", "rlib"]

[features]
# 既定は Blender 配布用の Python 拡張モジュール
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py311", "extension-module"], optional = true }
# 距離制約の並列求解に使う。彩色した色の中だけを並列に回す
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
